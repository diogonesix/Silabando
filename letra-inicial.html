<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silabando - Letra Inicial</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Polyfill para suporte a Drag and Drop em dispositivos móveis (Touch) -->
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FDFBF7;
            background-image: radial-gradient(#d1d5db 2px, transparent 2px);
            background-size: 24px 24px;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(0); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }

        @keyframes rocket-launch {
            0% { transform: translateY(0); }
            10% { transform: translateY(10px); }
            100% { transform: translateY(-1000px); }
        }
        .animate-launch { animation: rocket-launch 2s ease-in forwards; }

        .letter-option {
            touch-action: none;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col text-gray-800 selection:bg-indigo-200">

    <!-- ARIA Live Region para Leitores de Tela -->
    <div id="aria-announcer" aria-live="polite" class="sr-only"></div>

    <!-- TELA DE VITÓRIA (Meta Atingida) -->
    <div id="victory-screen" class="absolute inset-0 z-50 hidden flex-col items-center justify-center p-4 bg-[#FDFBF7]/95 backdrop-blur-sm">
        <div class="bg-indigo-50 p-6 sm:p-10 rounded-[2rem] shadow-2xl shadow-indigo-200 border-4 border-indigo-400 max-w-lg w-full text-center flex flex-col items-center relative overflow-hidden">
            
            <div class="text-6xl mb-4 animate-bounce" aria-hidden="true">🏆</div>
            
            <h1 class="text-4xl font-extrabold text-indigo-700 mb-2">Parabéns, <span id="victory-name">Jogador</span>!</h1>
            <p class="text-lg text-indigo-600 font-bold mb-6">Você completou os <span id="victory-target">10</span> desafios de Letra Inicial!</p>
            
            <div class="bg-white p-6 rounded-2xl shadow-md border-2 border-indigo-100 w-full mb-8 transform hover:scale-105 transition-transform cursor-default">
                <div class="text-4xl mb-2" aria-hidden="true">🌟</div>
                <p class="text-indigo-800 font-extrabold text-xl leading-tight">Excelente reconhecimento das letras!</p>
                <p class="text-gray-500 font-bold mt-2 text-sm">Você já pode escolher outra atividade ou continuar praticando.</p>
            </div>

            <div class="w-full flex flex-col sm:flex-row gap-3">
                <a href="index.html" class="w-full sm:w-1/2 bg-white hover:bg-gray-50 text-gray-700 border-2 border-gray-200 rounded-xl py-3 text-lg font-extrabold shadow-sm active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-5 h-5"></i> Menu Inicial
                </a>
                <button onclick="resetGame()" class="w-full sm:w-1/2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 text-lg font-extrabold shadow-lg shadow-indigo-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                    Jogar Novamente <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- JOGO PRINCIPAL -->
    <div id="game-container" class="h-full w-full flex flex-col">
        <!-- HEADER -->
        <header class="w-full max-w-6xl mx-auto px-4 pt-2 pb-1 flex justify-between items-center shrink-0">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center bg-white border-2 border-gray-200 rounded-xl text-gray-500 hover:text-indigo-500 hover:border-indigo-300 shadow-sm transition-colors" title="Voltar ao Menu Inicial" aria-label="Voltar ao Menu Inicial">
                <i data-lucide="home" class="w-5 h-5"></i>
            </a>

            <div class="flex flex-col items-center text-center">
                <div class="bg-indigo-50 text-indigo-600 uppercase tracking-widest text-[9px] sm:text-[10px] font-bold px-3 py-1 rounded-full mb-1 shadow-sm border border-indigo-100">
                    Letra Inicial • <span id="header-player-name" class="font-extrabold">Jogador</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800 tracking-tight mb-0">Qual é a primeira letra?</h1>
            </div>

            <button onclick="toggleFullscreen()" class="w-10 h-10 flex items-center justify-center bg-white border-2 border-gray-200 rounded-xl text-gray-500 hover:text-indigo-500 hover:border-indigo-300 shadow-sm transition-colors" title="Tela Cheia (F11)" aria-label="Alternar Tela Cheia">
                <i data-lucide="maximize" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- BARRA SUPERIOR DE CONTROLE -->
        <section class="w-full max-w-3xl mx-auto px-4 mb-2 flex justify-between items-center shrink-0">
            <div class="text-xs sm:text-sm font-bold text-gray-500 bg-white px-3 py-1.5 rounded-xl border border-gray-200 shadow-sm">
                Acertos: <span id="score-counter-mobile" class="text-indigo-600 font-black">0</span> / <span id="target-counter-mobile">10</span>
            </div>
            <button onclick="loadRandomWord()" class="bg-white hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded-xl font-bold shadow-sm border-2 border-gray-200 transition-all active:scale-95 flex items-center gap-1.5 text-xs sm:text-sm" title="Pular Palavra" aria-label="Sortear outra imagem">
                <i data-lucide="shuffle" class="w-4 h-4 text-indigo-500"></i> Trocar Figura
            </button>
        </section>

        <!-- ÁREA PRINCIPAL -->
        <main class="flex-grow w-full max-w-5xl mx-auto px-2 sm:px-4 pb-2 flex flex-col md:flex-row gap-4 items-center justify-center min-h-0 relative">
            
            <!-- CARTÃO DO JOGO -->
            <div id="game-card" class="w-full max-w-3xl bg-white rounded-[1.5rem] shadow-xl shadow-gray-200/60 border border-gray-100 p-4 sm:p-6 flex flex-col items-center justify-between h-full transition-transform">
                
                <!-- Corações -->
                <div id="hearts-container" class="w-full flex justify-center gap-1.5 shrink-0" aria-label="Tentativas restantes"></div>

                <!-- Ilustração e Som -->
                <div class="relative w-full flex-grow flex flex-col justify-center items-center min-h-[6rem]">
                    <div id="emoji-display" class="text-7xl sm:text-8xl filter drop-shadow-md select-none animate-bounce-slow mb-2" aria-hidden="true">🍎</div>
                    <button onclick="speakCurrentWord()" class="absolute top-0 right-0 bg-indigo-50 text-indigo-500 hover:bg-indigo-100 p-2.5 sm:p-3 rounded-full transition-colors active:scale-90 shadow-sm" title="Ouvir Nome da Figura" aria-label="Ouvir nome da figura">
                        <i data-lucide="volume-2" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </button>
                </div>

                <!-- Área de Resposta / Exibição da Palavra -->
                <div id="answer-area" class="w-full flex flex-col items-center justify-center my-3 shrink-0">
                    <!-- Slot Alvo (Antes de acertar) -->
                    <div id="target-slot" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-4 border-dashed border-indigo-300 bg-indigo-50/50 flex items-center justify-center text-4xl sm:text-5xl font-black text-indigo-300 transition-all" aria-label="Espaço para a letra inicial">
                        ?
                    </div>
                    <!-- Palavra Revelada (Após acertar ou esgotar tentativas) -->
                    <div id="revealed-word" class="hidden text-3xl sm:text-5xl font-black tracking-wide uppercase mt-2"></div>
                </div>

                <!-- Banco de Opções de Letras -->
                <div id="options-container" class="w-full bg-indigo-50/50 border-2 border-indigo-100 rounded-2xl p-3 sm:p-4 flex flex-wrap justify-center gap-3 sm:gap-4 shrink-0" aria-label="Opções de letras"></div>
            </div>

            <!-- FOGUETE PROGRESSO (Desktop - Vertical) -->
            <div class="hidden md:flex h-full w-24 flex-col items-center justify-end pb-8 relative shrink-0">
                <div class="absolute top-0 text-sm font-bold text-gray-500 uppercase tracking-widest bg-white px-2 py-1 rounded-full shadow-sm border border-gray-100 z-10 whitespace-nowrap">
                    Meta: <span id="rocket-target-desktop" class="text-indigo-500">10</span>
                </div>
                <div class="absolute h-full w-8 bg-indigo-100/50 rounded-full border-2 border-dashed border-indigo-200 top-4"></div>
                <div id="rocket-desktop" class="z-20 transition-all duration-1000 ease-out" style="transform: translateY(0px);">
                    <svg width="80" height="120" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-xl" aria-hidden="true">
                        <path d="M 40 110 Q 50 150 60 110 Q 55 120 50 140 Q 45 120 40 110" fill="#818cf8" class="animate-pulse" />
                        <path d="M 45 110 Q 50 135 55 110 Q 52 115 50 130 Q 48 115 45 110" fill="#fef08a" class="animate-pulse" />
                        <path d="M 30 70 C 15 80 15 100 20 115 C 30 100 30 80 30 70" fill="#38bdf8" />
                        <path d="M 70 70 C 85 80 85 100 80 115 C 70 100 70 80 70 70" fill="#38bdf8" />
                        <path d="M 45 85 L 55 85 L 55 120 L 50 130 L 45 120 Z" fill="#4f46e5" />
                        <path d="M 25 70 C 25 20 50 0 50 0 C 50 0 75 20 75 70 C 75 100 65 110 50 110 C 35 110 25 100 25 70 Z" fill="#fffbeb" stroke="#d6d3d1" stroke-width="2"/>
                        <path d="M 33 30 C 40 15 50 0 50 0 C 50 0 60 15 67 30 Q 50 35 33 30 Z" fill="#6366f1" />
                        <circle cx="50" cy="50" r="12" fill="#bae6fd" stroke="#94a3b8" stroke-width="3" />
                        <circle cx="50" cy="50" r="8" fill="#e0f2fe" />
                    </svg>
                </div>
            </div>
        </main>

        <!-- FOGUETE PROGRESSO (Mobile - Horizontal) -->
        <div class="md:hidden w-full h-16 bg-white border-t-2 border-gray-100 flex items-center px-4 shrink-0 relative overflow-hidden">
            <div class="absolute left-2 text-[10px] font-bold text-gray-400 uppercase leading-tight z-10">
                <span id="player-name-display" class="text-indigo-500">Nome</span><br>
                Progresso (<span id="rocket-target-mobile">10</span>)
            </div>
            <div class="w-full h-4 bg-indigo-100/50 rounded-full border-2 border-dashed border-indigo-200 absolute left-0 top-1/2 -translate-y-1/2 ml-16 mr-4"></div>
            <div id="rocket-mobile" class="z-20 transition-all duration-1000 ease-out absolute left-16 top-1/2 -translate-y-1/2 rotate-90 scale-50" style="transform: translateY(-50%) rotate(90deg) translateX(0px);">
                <svg width="80" height="120" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-xl" aria-hidden="true">
                    <path d="M 40 110 Q 50 150 60 110 Q 55 120 50 140 Q 45 120 40 110" fill="#818cf8" class="animate-pulse" />
                    <path d="M 45 110 Q 50 135 55 110 Q 52 115 50 130 Q 48 115 45 110" fill="#fef08a" class="animate-pulse" />
                    <path d="M 30 70 C 15 80 15 100 20 115 C 30 100 30 80 30 70" fill="#38bdf8" />
                    <path d="M 70 70 C 85 80 85 100 80 115 C 70 100 70 80 70 70" fill="#38bdf8" />
                    <path d="M 45 85 L 55 85 L 55 120 L 50 130 L 45 120 Z" fill="#4f46e5" />
                    <path d="M 25 70 C 25 20 50 0 50 0 C 50 0 75 20 75 70 C 75 100 65 110 50 110 C 35 110 25 100 25 70 Z" fill="#fffbeb" stroke="#d6d3d1" stroke-width="2"/>
                    <path d="M 33 30 C 40 15 50 0 50 0 C 50 0 60 15 67 30 Q 50 35 33 30 Z" fill="#6366f1" />
                    <circle cx="50" cy="50" r="12" fill="#bae6fd" stroke="#94a3b8" stroke-width="3" />
                    <circle cx="50" cy="50" r="8" fill="#e0f2fe" />
                </svg>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        lucide.createIcons();

        const STORAGE_KEY = 'silabando_state';
        const DEFAULT_TARGET = 10;
        let countdownInterval;

        // --- BANCO DE PALAVRAS E ILUSTRAÇÕES ---
        const WORDS_DB = [
            { word: 'abelha', emoji: '🐝' },
            { word: 'avião', emoji: '✈️' },
            { word: 'abacaxi', emoji: '🍍' },
            { word: 'árvore', emoji: '🌳' },
            { word: 'banana', emoji: '🍌' },
            { word: 'bola', emoji: '⚽' },
            { word: 'bicicleta', emoji: '🚲' },
            { word: 'borboleta', emoji: '🦋' },
            { word: 'casa', emoji: '🏠' },
            { word: 'cachorro', emoji: '🐶' },
            { word: 'cavalo', emoji: '🐴' },
            { word: 'cobra', emoji: '🐍' },
            { word: 'dado', emoji: '🎲' },
            { word: 'dinossauro', emoji: '🦖' },
            { word: 'elefante', emoji: '🐘' },
            { word: 'estrela', emoji: '⭐' },
            { word: 'escola', emoji: '🏫' },
            { word: 'foguete', emoji: '🚀' },
            { word: 'flor', emoji: '🌻' },
            { word: 'formiga', emoji: '🐜' },
            { word: 'gato', emoji: '🐱' },
            { word: 'girafa', emoji: '🦒' },
            { word: 'helicóptero', emoji: '🚁' },
            { word: 'hipopótamo', emoji: '🦛' },
            { word: 'ilha', emoji: '🏝️' },
            { word: 'igreja', emoji: '⛪' },
            { word: 'jacaré', emoji: '🐊' },
            { word: 'joaninha', emoji: '🐞' },
            { word: 'leão', emoji: '🦁' },
            { word: 'lua', emoji: '🌙' },
            { word: 'lápis', emoji: '✏️' },
            { word: 'macaco', emoji: '🐵' },
            { word: 'maçã', emoji: '🍎' },
            { word: 'morango', emoji: '🍓' },
            { word: 'nuvem', emoji: '☁️' },
            { word: 'navio', emoji: '🚢' },
            { word: 'ovo', emoji: '🥚' },
            { word: 'óculos', emoji: '👓' },
            { word: 'pato', emoji: '🦆' },
            { word: 'peixe', emoji: '🐟' },
            { word: 'pipoca', emoji: '🍿' },
            { word: 'queijo', emoji: '🧀' },
            { word: 'rato', emoji: '🐭' },
            { word: 'robô', emoji: '🤖' },
            { word: 'sapo', emoji: '🐸' },
            { word: 'sol', emoji: '☀️' },
            { word: 'sorvete', emoji: '🍦' },
            { word: 'tartaruga', emoji: '🐢' },
            { word: 'trem', emoji: '🚂' },
            { word: 'uva', emoji: '🍇' },
            { word: 'urso', emoji: '🐻' },
            { word: 'vaca', emoji: '🐮' },
            { word: 'violão', emoji: '🎸' },
            { word: 'zebra', emoji: '🦓' }
        ];

        const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

        // --- ESTADO DO JOGO ---
        const state = {
            playerName: '',
            targetScore: DEFAULT_TARGET,
            currentScore: 0,
            currentItem: null,
            targetLetter: '',
            options: [],
            attemptsLeft: 3,
            isRoundOver: false,
            shakeError: false
        };

        // --- INICIALIZAÇÃO VIA LOCALSTORAGE ---
        function initGame() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) {
                    window.location.href = 'index.html';
                    return;
                }

                const data = JSON.parse(saved);
                if (!data.name || data.name.trim() === '') {
                    window.location.href = 'index.html';
                    return;
                }

                state.playerName = data.name.trim();
                state.targetScore = parseInt(data.letraInicialTarget) || DEFAULT_TARGET;
                state.currentScore = typeof data.letraInicialScore === 'number' ? data.letraInicialScore : 0;

                if (state.currentScore >= state.targetScore) {
                    state.currentScore = 0;
                }

                document.getElementById('header-player-name').innerText = state.playerName;
                document.getElementById('player-name-display').innerText = state.playerName;
                document.getElementById('rocket-target-desktop').innerText = state.targetScore;
                document.getElementById('rocket-target-mobile').innerText = state.targetScore;
                document.getElementById('target-counter-mobile').innerText = state.targetScore;

                savePlayerProfile();
                updateProgressVisual();
                setupDropZone();
                loadRandomWord();
            } catch (e) {
                console.error("Erro ao inicializar o módulo.", e);
                window.location.href = 'index.html';
            }
        }

        function savePlayerProfile() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                const data = saved ? JSON.parse(saved) : {};
                data.name = state.playerName;
                data.letraInicialScore = state.currentScore;
                data.letraInicialTarget = state.targetScore;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error("Erro ao salvar progresso.", e);
            }
        }

        window.onload = initGame;

        function announceAria(text) {
            const announcer = document.getElementById('aria-announcer');
            if (announcer) announcer.innerText = text;
        }

        // --- SISTEMA DE ÁUDIO ---
        const playTone = (freq, type, duration, vol = 0.1) => {
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = new AudioContextClass();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        };

        const playSuccessSound = () => {
            playTone(523.25, 'sine', 0.4);
            setTimeout(() => playTone(659.25, 'sine', 0.4), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.5), 200);
        };

        const playErrorSound = () => {
            playTone(150, 'sawtooth', 0.3, 0.15);
        };

        const speakText = (text, rate = 0.75) => {
            if (!('speechSynthesis' in window)) return null;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = rate;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
            return utterance;
        };

        const speakCurrentWord = () => {
            if (state.currentItem) {
                speakText(state.currentItem.word, 0.7);
            }
        };

        // --- NORMALIZAÇÃO DE LETRA INICIAL ---
        function getNormalizedFirstLetter(word) {
            return word.charAt(0)
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toUpperCase();
        }

        // --- LÓGICA DO JOGO ---
        function resetGame() {
            state.currentScore = 0;
            savePlayerProfile();
            document.getElementById('victory-screen').classList.add('hidden');
            document.getElementById('rocket-desktop').classList.remove('animate-launch');
            document.getElementById('rocket-mobile').classList.remove('animate-launch');
            updateProgressVisual();
            loadRandomWord();
        }

        function loadRandomWord() {
            clearInterval(countdownInterval);
            let nextItem = WORDS_DB[Math.floor(Math.random() * WORDS_DB.length)];
            if (state.currentItem && nextItem.word === state.currentItem.word && WORDS_DB.length > 1) {
                while (nextItem.word === state.currentItem.word) {
                    nextItem = WORDS_DB[Math.floor(Math.random() * WORDS_DB.length)];
                }
            }

            state.currentItem = nextItem;
            state.targetLetter = getNormalizedFirstLetter(nextItem.word);
            state.attemptsLeft = 3;
            state.isRoundOver = false;
            state.shakeError = false;

            const distractors = ALPHABET.filter(l => l !== state.targetLetter);
            const selectedDistractors = [];
            while (selectedDistractors.length < 3) {
                const randIndex = Math.floor(Math.random() * distractors.length);
                selectedDistractors.push(distractors.splice(randIndex, 1)[0]);
            }

            const rawOptions = [state.targetLetter, ...selectedDistractors].sort(() => Math.random() - 0.5);
            state.options = rawOptions.map(letter => ({
                letter,
                disabled: false,
                status: 'default'
            }));

            render();
            setTimeout(() => speakCurrentWord(), 300);
            announceAria(`Nova figura exibida. Escolha a letra inicial entre ${rawOptions.join(', ')}.`);
        }

        function selectLetter(letter) {
            if (state.isRoundOver) return;
            const optionObj = state.options.find(o => o.letter === letter);
            if (!optionObj || optionObj.disabled) return;

            if (letter === state.targetLetter) {
                handleWin(optionObj);
            } else {
                handleError(optionObj);
            }
        }

        function handleWin(optionObj) {
            state.isRoundOver = true;
            optionObj.status = 'correct';
            playSuccessSound();
            confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, colors: ['#6366f1', '#10b981', '#f59e0b'] });

            state.currentScore++;
            savePlayerProfile();
            updateProgressVisual();

            speakText(`${state.targetLetter} de ${state.currentItem.word}!`, 0.8);
            announceAria(`Correto! ${state.targetLetter} de ${state.currentItem.word}.`);

            render();

            if (state.currentScore >= state.targetScore) {
                document.getElementById('rocket-desktop').classList.add('animate-launch');
                document.getElementById('rocket-mobile').classList.add('animate-launch');

                setTimeout(() => {
                    document.getElementById('victory-name').innerText = state.playerName;
                    document.getElementById('victory-target').innerText = state.targetScore;
                    document.getElementById('victory-screen').classList.remove('hidden');
                    document.getElementById('victory-screen').classList.add('flex');
                    speakText(`Parabéns ${state.playerName}! Você completou o desafio!`, 0.9);
                    confetti({ particleCount: 250, spread: 100, origin: { y: 0.3 } });
                }, 1500);
            } else {
                startCountdown(4);
            }
        }

        function handleError(optionObj) {
            playErrorSound();
            optionObj.disabled = true;
            optionObj.status = 'wrong';
            state.shakeError = true;
            state.attemptsLeft--;

            speakText(`Letra ${optionObj.letter}. Tente outra vez.`, 0.85);
            announceAria(`Letra ${optionObj.letter} incorreta.`);
            render();

            setTimeout(() => {
                state.shakeError = false;
                document.getElementById('game-card').classList.remove('animate-shake');
            }, 450);

            if (state.attemptsLeft <= 0) {
                state.isRoundOver = true;
                const correctOpt = state.options.find(o => o.letter === state.targetLetter);
                if (correctOpt) correctOpt.status = 'correct';
                
                setTimeout(() => {
                    speakText(`A letra correta é ${state.targetLetter}, de ${state.currentItem.word}.`, 0.8);
                    render();
                    startCountdown(5);
                }, 600);
            }
        }

        function startCountdown(seconds) {
            let left = seconds;
            const infoEl = document.getElementById('options-container');
            const updateMsg = () => {
                infoEl.innerHTML = `
                    <div class="w-full py-3 flex items-center justify-center gap-2 text-indigo-700 font-extrabold text-base sm:text-lg animate-pulse">
                        <i data-lucide="arrow-right-circle" class="w-6 h-6"></i>
                        <span>Próxima figura em ${left}s...</span>
                    </div>
                `;
                lucide.createIcons();
            };
            updateMsg();

            countdownInterval = setInterval(() => {
                left--;
                if (left > 0) {
                    updateMsg();
                } else {
                    clearInterval(countdownInterval);
                    loadRandomWord();
                }
            }, 1000);
        }

        // --- CONFIGURAÇÃO DE ARRASTAR E SOLTAR ---
        let draggedLetter = null;

        function setupDropZone() {
            const slot = document.getElementById('target-slot');
            slot.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!state.isRoundOver) {
                    slot.classList.add('bg-indigo-100', 'scale-105', 'border-indigo-500');
                }
            });
            slot.addEventListener('dragleave', () => {
                slot.classList.remove('bg-indigo-100', 'scale-105', 'border-indigo-500');
            });
            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                slot.classList.remove('bg-indigo-100', 'scale-105', 'border-indigo-500');
                if (draggedLetter && !state.isRoundOver) {
                    selectLetter(draggedLetter);
                }
            });
        }

        // --- RENDERIZAÇÃO ---
        function updateProgressVisual() {
            document.getElementById('score-counter-mobile').innerText = state.currentScore;
            const pct = Math.min((state.currentScore / state.targetScore) * 100, 100);
            
            const maxTranslateY = -400;
            const translateY = (pct / 100) * maxTranslateY;
            document.getElementById('rocket-desktop').style.transform = `translateY(${translateY}px)`;
            
            const maxTranslateX = window.innerWidth * 0.6;
            const translateX = (pct / 100) * maxTranslateX;
            document.getElementById('rocket-mobile').style.transform = `translateY(-50%) rotate(90deg) translateX(${translateX}px)`;
        }

        function render() {
            document.getElementById('hearts-container').innerHTML = [1, 2, 3].map(heart => `
                <i data-lucide="heart" aria-hidden="true" class="w-5 h-5 transition-colors drop-shadow-sm ${heart <= state.attemptsLeft ? 'text-red-500 fill-red-500' : 'text-gray-200 fill-gray-200'}"></i>
            `).join('');

            const card = document.getElementById('game-card');
            if (state.shakeError) card.classList.add('animate-shake');
            else card.classList.remove('animate-shake');

            document.getElementById('emoji-display').innerText = state.currentItem.emoji;

            const targetSlot = document.getElementById('target-slot');
            const revealedWord = document.getElementById('revealed-word');

            if (state.isRoundOver) {
                targetSlot.classList.add('hidden');
                revealedWord.classList.remove('hidden');
                
                const fullWord = state.currentItem.word.toUpperCase();
                const firstChar = fullWord.charAt(0);
                const restOfWord = fullWord.slice(1);

                revealedWord.innerHTML = `<span class="text-green-600 underline decoration-4 underline-offset-4">${firstChar}</span><span class="text-gray-700">${restOfWord}</span>`;
            } else {
                targetSlot.classList.remove('hidden');
                revealedWord.classList.add('hidden');
                targetSlot.innerText = '?';
            }

            if (!state.isRoundOver) {
                const optionsHtml = state.options.map(opt => {
                    let btnStyle = 'bg-white border-indigo-200 text-indigo-600 hover:border-indigo-400 hover:shadow-md hover:-translate-y-1 cursor-pointer';
                    if (opt.status === 'wrong') {
                        btnStyle = 'bg-red-50 border-red-200 text-red-300 opacity-60 cursor-not-allowed scale-95';
                    } else if (opt.status === 'correct') {
                        btnStyle = 'bg-green-500 border-green-600 text-white shadow-lg scale-105';
                    }

                    return `
                        <button 
                            onclick="selectLetter('${opt.letter}')"
                            draggable="${!opt.disabled ? 'true' : 'false'}"
                            data-letter="${opt.letter}"
                            ${opt.disabled ? 'disabled' : ''}
                            aria-label="Letra ${opt.letter}"
                            class="letter-option w-16 h-16 sm:w-20 sm:h-20 rounded-2xl border-4 text-3xl sm:text-4xl font-black flex items-center justify-center shadow-sm transition-all select-none ${btnStyle}">
                            ${opt.letter}
                        </button>
                    `;
                }).join('');

                document.getElementById('options-container').innerHTML = optionsHtml;

                document.querySelectorAll('.letter-option').forEach(btn => {
                    btn.addEventListener('dragstart', () => {
                        draggedLetter = btn.dataset.letter;
                    });
                });
            }

            lucide.createIcons();
        }

        // --- TELA CHEIA ---
        function toggleFullscreen() {
            const doc = window.document;
            const docEl = doc.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullScreen) {
                    try {
                        const promise = requestFullScreen.call(docEl);
                        if (promise && typeof promise.catch === 'function') {
                            promise.catch(() => alert("Pressione F11 no teclado para alternar a tela cheia."));
                        }
                    } catch (e) {}
                }
            } else {
                if (cancelFullScreen) cancelFullScreen.call(doc);
            }
        }
    </script>
</body>
</html>
